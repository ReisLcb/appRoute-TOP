<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Task manager
    </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
<ion-item>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Card Title</ion-card-title>
      <ion-card-subtitle>Card Subtitle</ion-card-subtitle>
    </ion-card-header>
  
    <ion-card-content>
      <ion-input type="text" label="Nome de usuário:" [(ngModel)]="nome"></ion-input>
      <ion-input type="password" label="Senha:" [(ngModel)]="senha"></ion-input>
    </ion-card-content>
  
    <ion-button (click)="cadastrarUsuario()">cadastrar-se</ion-button>
    <ion-button fill="clear" (click)="limpar()">Limpar</ion-button>
  </ion-card>
</ion-item>



</ion-content>
